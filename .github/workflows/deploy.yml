# Nombre del Workflow
name: Deploy to Hostmanía

# Disparador: se ejecuta cada vez que haces 'push' a la rama 'main'
on:
  push:
    branches: [ main ]

# Tareas a ejecutar
jobs:
  deploy:
    # Usa un servidor virtual de Linux para ejecutar los pasos
    runs-on: ubuntu-latest

    steps:
    # 1. Paso de conexión y ejecución de comandos en tu servidor
    - name: Deploy to Server
      # Usa una 'Action' popular de la comunidad para facilitar la conexión SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        known_hosts: |
          [77.37.88.109]:65002 ssh-rsa 
          [77.37.88.109]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBN0GYrI9id0vqi9Cj1nS28HAWXUMhzEWRYAXoRX0sMkn5GfNtXX+xUM7fUfKW/VIUoON/mfZxoXab4qdi7KNHUg=
          [77.37.88.109]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILKWSltaCD6srvQs9x0KK/k506M2fonkPZu1sFttOJOL
        script: |
          # Navega a la carpeta del proyecto en tu servidor
          cd public_html/public_html/chess_trainer
          # Ejecuta git pull para descargar los últimos cambios
          git pull
          # (Opcional) Aquí podrías añadir más comandos, como limpiar la caché
          echo "Despliegue completado exitosamente!"